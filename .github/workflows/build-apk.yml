name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'downloads/**'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Sincronizar aplicação Android
        run: npx cap sync android

      - name: Preparar Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Gerar APK de testes
        working-directory: android
        run: "$RUNNER_TEMP/gradle-8.2.1/bin/gradle assembleDebug --no-daemon"

      - name: Publicar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: carrossel-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Disponibilizar download permanente
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/Carrossel-Studio.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Carrossel-Studio.apk
          git diff --cached --quiet || git commit -m "Atualiza APK para download direto"
          git push
